<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#1A0F0F"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="FitHer"/>
<meta name="mobile-web-app-capable" content="yes"/>
<title>FitHer — 12-Week Program</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
:root{
  --rose:#E8705A;
  --rose-light:#F0967F;
  --rose-dark:#C45840;
  --dark:#1A0F0F;
  --card:#221414;
  --card2:#2A1818;
  --border:#3D2020;
  --muted:#9A7070;
  --text:#F5EAE8;
  --gold:#D4A853;
  --teal:#4DBFA8;
  --purple:#B07EC8;
}
html,body{background:var(--dark);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;height:100%;overflow-x:hidden;-webkit-text-size-adjust:100%}
input,button,select,textarea{font-family:inherit}
button{cursor:pointer;border:none;background:none}
input:focus{outline:2px solid var(--rose);outline-offset:1px}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}

/* Layout */
#app{min-height:100vh;padding-bottom:calc(env(safe-area-inset-bottom)+68px)}
#top-nav{position:sticky;top:0;z-index:100;background:var(--card);border-bottom:1px solid var(--border);
  padding:calc(env(safe-area-inset-top)+6px) 10px 6px;display:flex;gap:4px;overflow-x:auto;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
#top-nav::-webkit-scrollbar{display:none}
.tnav-btn{flex-shrink:0;padding:6px 12px;border-radius:20px;font-size:11px;font-weight:700;color:var(--muted);border:1px solid transparent;white-space:nowrap;transition:all .15s}
.tnav-btn.active{color:var(--rose);background:rgba(232,112,90,.12);border-color:rgba(232,112,90,.3)}
#content{max-width:640px;margin:0 auto;padding:14px 13px 8px}
.page{display:none}
.page.active{display:block}

/* Bottom nav */
#bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:100;background:var(--card);border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px 7px;font-size:10px;font-weight:700;color:var(--muted);background:none;border:none}
.bnav-btn.active{color:var(--rose)}
.bnav-btn span:first-child{font-size:21px;line-height:1}

/* Cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px}
.card-rose{border-color:rgba(232,112,90,.35)}
.card-gold{border-color:rgba(212,168,83,.35)}
.card-teal{border-color:rgba(77,191,168,.35)}
.card-purple{border-color:rgba(176,126,200,.35)}

/* Hero */
.hero{text-align:center;padding:20px 4px 14px;position:relative}
.hero-badge{display:inline-block;background:rgba(232,112,90,.15);border:1px solid rgba(232,112,90,.3);border-radius:999px;padding:5px 16px;font-size:11px;font-weight:700;letter-spacing:1.5px;color:var(--rose);margin-bottom:14px;text-transform:uppercase}
.hero-title{font-size:28px;font-weight:900;line-height:1.15;letter-spacing:-.5px;margin-bottom:8px}
.hero-accent{color:var(--rose)}
.hero-sub{color:var(--muted);font-size:13px}

/* Stat grid */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat-card{background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:14px;text-align:center;position:relative;overflow:hidden}
.stat-card::before{content:"";position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--rose);opacity:.4}
.stat-val{font-size:22px;font-weight:900;color:var(--rose)}
.stat-label{font-size:12px;font-weight:700;margin-top:3px}
.stat-sub{font-size:11px;color:var(--muted);margin-top:2px}

/* Phase timeline */
.timeline{position:relative;padding-left:20px;margin-bottom:4px}
.timeline::before{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:1px;background:var(--border)}
.tl-item{position:relative;margin-bottom:10px}
.tl-dot{position:absolute;left:-16px;top:12px;width:10px;height:10px;border-radius:50%;border:2px solid}
.tl-card{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:11px 14px}
.tl-wk{font-size:11px;font-family:monospace;font-weight:700;margin-bottom:2px}
.tl-name{font-size:13px;font-weight:800}
.tl-focus{font-size:12px;color:var(--muted);margin-top:1px}

/* Section labels */
.section-label{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px}
.page-title{font-size:22px;font-weight:900;margin-bottom:3px}
.page-sub{font-size:13px;color:var(--muted);margin-bottom:18px}

/* Pills */
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:11px;font-weight:700;letter-spacing:.5px}
.pill-rose{background:rgba(232,112,90,.15);color:var(--rose);border:1px solid rgba(232,112,90,.3)}
.pill-gold{background:rgba(212,168,83,.15);color:var(--gold);border:1px solid rgba(212,168,83,.3)}
.pill-teal{background:rgba(77,191,168,.15);color:var(--teal);border:1px solid rgba(77,191,168,.3)}
.pill-muted{background:rgba(154,112,112,.15);color:var(--muted);border:1px solid rgba(154,112,112,.3)}

/* Split rows */
.split-row{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border)}
.split-row:last-child{border-bottom:none}
.split-day{min-width:82px;font-family:monospace;font-size:11px;color:var(--muted);padding-top:2px}
.split-session{font-size:13px;font-weight:700}
.split-muscle{font-size:11px;color:var(--muted);margin-top:2px}
.focus-tag{display:inline-block;font-size:10px;font-weight:700;color:var(--rose);background:rgba(232,112,90,.1);border-radius:5px;padding:1px 6px;margin-left:5px;vertical-align:middle}

/* Week selector */
.week-grid{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.week-btn{padding:5px 9px;border-radius:20px;font-size:11px;font-weight:700;border:1px solid var(--border);background:var(--card);color:var(--muted)}
.week-btn.active{background:var(--rose);color:#fff;border-color:var(--rose)}
.week-btn.has-data{border-color:rgba(232,112,90,.4);color:var(--rose)}

/* Day buttons */
.day-grid{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.day-btn{padding:8px 14px;border-radius:20px;font-size:12px;font-weight:700;border:1px solid var(--border);background:var(--card);color:var(--muted)}
.day-btn.active{background:var(--rose);color:#fff;border-color:var(--rose)}

/* Exercise block */
.ex-block{background:var(--card2);border-radius:14px;padding:14px;border:1px solid var(--border);margin-bottom:10px}
.ex-block.done{border-color:rgba(232,112,90,.5)}
.ex-block.glute{border-left:3px solid var(--gold)}
.ex-name{font-size:14px;font-weight:700;margin-bottom:3px}
.ex-meta{font-size:11px;color:var(--muted)}
.ex-prog{color:var(--rose)}
.warmup-tag{display:inline-block;font-size:11px;color:var(--gold);background:rgba(212,168,83,.1);border-radius:6px;padding:2px 8px;margin:6px 0}
.glute-tag{display:inline-block;font-size:10px;color:var(--gold);background:rgba(212,168,83,.15);border:1px solid rgba(212,168,83,.3);border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:middle}
.sub-tag{font-size:11px;color:var(--muted);margin-top:6px}

/* Set rows */
.set-headers{display:grid;grid-template-columns:38px 1fr 1fr 52px;gap:5px;padding-bottom:4px;border-bottom:1px solid var(--border);margin-bottom:5px}
.set-hdr{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.6px}
.set-row{display:grid;grid-template-columns:38px 1fr 1fr 52px;gap:5px;align-items:center;margin-bottom:4px;border-radius:8px;padding:2px 0}
.set-row.done{background:rgba(232,112,90,.05)}
.set-num{font-size:12px;font-weight:700;color:var(--muted)}
.set-row.done .set-num{color:var(--rose)}
.set-input{width:100%;background:#1A0F0F;border:1px solid var(--border);border-radius:8px;padding:8px 9px;color:var(--text);font-size:16px;font-family:monospace}
.set-input.filled{border-color:rgba(232,112,90,.55)}
.set-status{font-size:11px;font-weight:700;text-align:center;border-radius:7px;padding:6px 2px;background:rgba(61,32,32,.6);color:var(--muted)}
.set-status.done{background:rgba(232,112,90,.15);color:var(--rose)}

/* Vol badge */
.vol-badge{display:inline-block;background:rgba(232,112,90,.12);border:1px solid rgba(232,112,90,.25);border-radius:7px;padding:2px 8px;font-size:11px;color:var(--rose);font-weight:700}

/* Phase banner */
.phase-banner{border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:13px}
.phase-title{font-weight:700;margin-bottom:2px}
.phase-note{color:var(--muted);font-size:12px}
.deload-tag{display:inline-block;background:rgba(212,168,83,.15);color:var(--gold);border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700;margin-left:6px}

/* Log actions */
.log-actions{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.log-vol{font-size:13px;font-weight:700;color:var(--rose)}
.btn-clear{padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700;color:var(--muted);border:1px solid var(--border);background:transparent}
.btn-save{padding:6px 16px;border-radius:20px;font-size:12px;font-weight:800;background:var(--rose);color:#fff;border:none}
.btn-save.flashed{background:var(--rose-dark)}

/* Macro table */
.mtable-wrap{overflow-x:auto;border-radius:10px;margin-bottom:12px}
.mtable{width:100%;border-collapse:collapse;font-size:12px;border-radius:10px;overflow:hidden;border:1px solid var(--border)}
.mtable th{padding:9px 11px;background:#140A0A;color:var(--rose);font-weight:700;text-align:left;font-size:11px}
.mtable td{padding:8px 11px;color:var(--muted);border-top:1px solid var(--border)}
.mtable td:first-child{color:var(--text);font-weight:600}

/* Timing rows */
.timing-row{display:flex;gap:11px;background:var(--card2);border:1px solid var(--border);border-radius:11px;padding:10px 13px;margin-bottom:7px}
.timing-time{min-width:68px;font-family:monospace;color:var(--rose);font-size:11px;font-weight:700;padding-top:1px;flex-shrink:0}
.timing-label{font-size:13px;font-weight:700}
.timing-note{font-size:12px;color:var(--muted);margin-top:2px}

/* Recipe cards */
.recipe-card{background:var(--card);border:1px solid var(--border);border-radius:16px;margin-bottom:10px;overflow:hidden}
.recipe-header{display:flex;justify-content:space-between;align-items:center;padding:14px 15px;cursor:pointer}
.recipe-name{font-size:14px;font-weight:700;margin-bottom:3px}
.recipe-kcal{font-size:12px;color:var(--rose);font-weight:700}
.recipe-prep{font-size:12px;color:var(--muted)}
.macro-badges{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.mbadge{border-radius:20px;padding:2px 8px;font-size:11px;font-weight:700}
.mbadge-p{background:rgba(77,191,168,.15);color:var(--teal)}
.mbadge-c{background:rgba(212,168,83,.15);color:var(--gold)}
.mbadge-f{background:rgba(176,126,200,.15);color:var(--purple)}
.recipe-toggle{font-size:14px;color:var(--muted);flex-shrink:0;padding-left:10px}
.recipe-body{border-top:1px solid var(--border);padding:13px 15px;display:none}
.recipe-body.open{display:block}
.recipe-section-lbl{font-size:11px;font-weight:700;color:var(--rose);letter-spacing:.8px;margin-bottom:6px;text-transform:uppercase}
.recipe-list{padding-left:16px;color:var(--muted);font-size:13px;line-height:1.9;margin-bottom:10px}

/* Tracker grid */
.tracker-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:18px}
.wk-card{border-radius:12px;padding:9px 5px;cursor:pointer;text-align:center;border:2px solid var(--border);background:#140A0A;transition:all .12s}
.wk-num{font-size:13px;font-weight:800}
.wk-phase{font-size:10px;color:var(--muted);margin-top:1px}
.wk-vol{font-size:11px;font-weight:700;margin-top:4px;color:var(--border)}
.wk-vol.has{color:var(--rose)}
.wk-dots{display:flex;justify-content:center;gap:3px;margin-top:5px}
.wk-dot{width:6px;height:6px;border-radius:50%;background:var(--border)}
.wk-dot.done{background:var(--rose)}

/* Week detail */
.wk-detail{border-radius:14px;padding:14px 15px;margin-bottom:14px}
.wk-detail-title{font-size:18px;font-weight:800;margin-bottom:3px}
.wk-detail-note{font-size:12px;color:var(--muted)}
.session-btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.session-btn{padding:7px 12px;border-radius:20px;font-size:11px;font-weight:700;border:1px solid var(--border);background:#140A0A;color:var(--muted);cursor:pointer}
.session-btn.active{background:var(--rose);color:#fff;border-color:var(--rose)}
.session-btn.has-data{border-color:rgba(232,112,90,.5);color:var(--rose)}

/* PR board */
.pr-row{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:#140A0A;border-radius:10px;border:1px solid var(--border);margin-bottom:7px}
.pr-ex{font-size:13px;font-weight:600}
.pr-val{font-size:16px;font-weight:800;color:var(--gold)}

/* Volume chart */
.vol-chart{display:flex;align-items:flex-end;gap:3px;height:48px;margin-bottom:4px}
.vol-bar{flex:1;border-radius:3px 3px 0 0;min-height:2px;opacity:.3}
.vol-bar.has{opacity:1}
.vol-labels{display:flex;margin-bottom:10px}
.vol-label{flex:1;text-align:center;font-size:9px;font-weight:700;color:var(--border)}
.vol-label.has{color:var(--rose)}

/* Shopping */
.shop-item{display:flex;gap:10px;align-items:center;padding:7px 0;cursor:pointer}
.shop-check{width:20px;height:20px;border-radius:6px;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .1s}
.shop-check.checked{background:var(--rose);border-color:var(--rose)}
.shop-check-inner{font-size:12px;font-weight:900;color:#fff;display:none}
.shop-check.checked .shop-check-inner{display:block}
.shop-text{font-size:13px}
.shop-text.checked{color:var(--muted);text-decoration:line-through}

/* Cat tabs */
.cat-tabs{display:flex;gap:7px;margin-bottom:14px}
.cat-tab{flex:1;padding:8px 6px;border-radius:20px;font-size:12px;font-weight:700;border:1px solid var(--border);background:var(--card);color:var(--muted);text-align:center}
.cat-tab.active{background:var(--rose);color:#fff;border-color:var(--rose)}

/* Schedule */
.sch-card{background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:14px 15px;margin-bottom:10px}
.sch-day{font-family:monospace;font-size:12px;font-weight:700;color:var(--rose);margin-bottom:2px}
.sch-session{font-size:15px;font-weight:800;margin-bottom:8px}
.sch-meals{padding-top:8px;border-top:1px solid var(--border)}
.sch-meal{display:flex;gap:8px;font-size:12px;color:var(--muted);margin-bottom:3px}

/* ── EXERCISE DEMO MODAL ── */
#demo-modal{position:fixed;inset:0;z-index:500;display:none;align-items:flex-end}
#demo-modal.open{display:flex}
.demo-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.75)}
.demo-sheet{position:relative;z-index:1;background:var(--card);border-radius:24px 24px 0 0;border:1px solid var(--border);width:100%;max-height:92vh;overflow-y:auto;padding:20px 18px 40px}
.demo-close{position:absolute;top:14px;right:14px;background:var(--card2);border:1px solid var(--border);border-radius:50%;width:32px;height:32px;font-size:18px;color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer}
.demo-title{font-size:19px;font-weight:900;margin-bottom:4px;padding-right:40px}
.demo-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}

/* How-to steps */
.howto-title{font-size:13px;font-weight:800;color:var(--rose);letter-spacing:.8px;text-transform:uppercase;margin-bottom:10px}
.howto-step{display:flex;gap:10px;margin-bottom:10px;align-items:flex-start}
.howto-num{width:24px;height:24px;border-radius:50%;background:var(--rose);color:#fff;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.howto-text{font-size:13px;color:var(--muted);line-height:1.6;flex:1}
.howto-text strong{color:var(--text)}
/* Key cues */
.cues-title{font-size:13px;font-weight:800;color:var(--gold);letter-spacing:.8px;text-transform:uppercase;margin:14px 0 8px}
.cue-item{display:flex;gap:8px;margin-bottom:7px;font-size:13px;color:var(--muted)}
.cue-icon{font-size:16px;flex-shrink:0}
/* Muscles hit */
.muscles-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
/* Info btn on exercise */
.info-btn{background:rgba(232,112,90,.12);border:1px solid rgba(232,112,90,.3);border-radius:20px;padding:3px 10px;font-size:11px;font-weight:700;color:var(--rose);cursor:pointer;white-space:nowrap;flex-shrink:0}

/* ── WELLNESS TAB ── */
.wellness-hero{background:linear-gradient(135deg,rgba(176,126,200,.15),rgba(232,112,90,.1));border:1px solid rgba(176,126,200,.3);border-radius:18px;padding:20px;margin-bottom:16px;text-align:center}
.wellness-hero-title{font-size:22px;font-weight:900;margin-bottom:6px}
.wellness-hero-sub{font-size:13px;color:var(--muted);line-height:1.6}
/* Phase cycle selector */
.cycle-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.cycle-tab{padding:12px 8px;border-radius:14px;border:1px solid var(--border);background:var(--card2);cursor:pointer;text-align:center}
.cycle-tab.active{border-color:rgba(176,126,200,.5);background:rgba(176,126,200,.1)}
.cycle-tab-icon{font-size:24px;margin-bottom:4px}
.cycle-tab-label{font-size:12px;font-weight:700}
.cycle-tab-sub{font-size:11px;color:var(--muted);margin-top:1px}
.cycle-tab.active .cycle-tab-label{color:var(--purple)}
/* Advice cards */
.advice-section{margin-bottom:6px}
.advice-header{font-size:15px;font-weight:800;margin-bottom:12px}
.advice-card{background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px}
.advice-card-title{font-size:13px;font-weight:800;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.advice-card-body{font-size:13px;color:var(--muted);line-height:1.7}
.advice-list{list-style:none;padding:0;margin:6px 0 0}
.advice-list li{display:flex;gap:8px;margin-bottom:5px;font-size:13px;color:var(--muted);align-items:flex-start}
.advice-list li::before{content:"→";color:var(--rose);flex-shrink:0;font-weight:700}
/* Energy meter */
.energy-btns{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.energy-btn{flex:1;min-width:80px;padding:10px 6px;border-radius:12px;border:1px solid var(--border);background:var(--card2);cursor:pointer;text-align:center;font-size:12px;font-weight:700;color:var(--muted)}
.energy-btn.active{border-color:rgba(232,112,90,.5);background:rgba(232,112,90,.1);color:var(--rose)}
/* Symptom toggle */
.symptom-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:14px}
.symptom-btn{padding:9px 8px;border-radius:11px;border:1px solid var(--border);background:var(--card2);cursor:pointer;text-align:center;font-size:12px;font-weight:600;color:var(--muted)}
.symptom-btn.active{border-color:rgba(176,126,200,.5);background:rgba(176,126,200,.1);color:var(--purple)}
/* Workout mod card */
.mod-card{border-radius:14px;padding:14px 15px;margin-bottom:10px;border:1px solid}
.mod-orig{font-size:11px;color:var(--muted);margin-bottom:3px;text-decoration:line-through}
.mod-new{font-size:14px;font-weight:700;margin-bottom:4px}
.mod-why{font-size:12px;color:var(--muted);line-height:1.5}

/* Page-enter animation */
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.page.active{animation:fadeUp .22s ease}



/* ── SESSION COMMENTS ── */
.comment-section{margin-top:14px;border-top:1px solid var(--border);padding-top:14px}
.comment-label{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.8px;text-transform:uppercase;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.comment-count{font-size:11px;font-weight:700;color:var(--rose)}
.comment-input-row{display:flex;gap:8px;margin-bottom:10px}
.comment-input{flex:1;background:#140A0A;border:1px solid var(--border);border-radius:10px;padding:9px 12px;color:var(--text);font-size:14px;resize:none;outline:none;min-height:42px;line-height:1.4}
.comment-input:focus{border-color:rgba(232,112,90,.5)}
.comment-submit{background:var(--rose);border:none;border-radius:10px;padding:9px 14px;color:#fff;font-size:13px;font-weight:800;cursor:pointer;flex-shrink:0;align-self:flex-end}
.comment-submit:active{background:var(--rose-dark)}
.comment-list{display:grid;gap:8px}
.comment-item{background:#140A0A;border:1px solid var(--border);border-radius:10px;padding:10px 12px;position:relative}
.comment-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.comment-date{font-size:11px;color:var(--muted);font-family:monospace}
.comment-rating{font-size:14px}
.comment-text{font-size:13px;color:var(--text);line-height:1.55}
.comment-delete{position:absolute;top:8px;right:8px;background:none;border:none;color:var(--border);font-size:16px;cursor:pointer;padding:2px 6px;border-radius:6px}
.comment-delete:active{color:var(--rose)}
.rating-row{display:flex;gap:6px;margin-bottom:8px}
.rating-btn{font-size:20px;background:none;border:none;cursor:pointer;opacity:.35;transition:opacity .15s;padding:2px}
.rating-btn.selected{opacity:1}
.no-comments{font-size:13px;color:var(--muted);text-align:center;padding:10px 0;font-style:italic}

function setSets(s){const m=s.match(/^(\d+)/);return m?Math.max(parseInt(m[1]),1):3;}
function sessionVol(wk,day){
  const d=(logs[wk]||{})[day];if(!d)return 0;let v=0;
  try{Object.values(d).forEach(ex=>{if(!ex||typeof ex!=="object")return;Object.values(ex).forEach(set=>{if(!set)return;v+=(parseFloat(set.kg)||0)*(parseFloat(set.reps)||0);});});}catch{}
  return Math.round(v);
}
function weekVol(wk){return Object.keys(WORKOUTS).reduce((a,d)=>a+sessionVol(wk,d),0);}
function weekDone(wk){return Object.keys(WORKOUTS).filter(d=>sessionVol(wk,d)>0).length;}
function phaseCol(phase){return PHASE_COLORS[phase]||"#E8705A";}

function el(tag,attrs,...children){
  const e=document.createElement(tag);
  if(attrs)Object.entries(attrs).forEach(([k,v])=>{if(k==="class")e.className=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2).toLowerCase(),v);else e.setAttribute(k,v);});
  children.flat().forEach(c=>{if(c==null||c===false)return;e.appendChild(typeof c==="string"?document.createTextNode(c):c);});
  return e;
}
function div(cls,...children){return el("div",{class:cls},...children);}

function renderLogger(container,wkIdx,dayKey){
  container.innerHTML="";
  const exList=WORKOUTS[dayKey];
  if(!exList){container.innerHTML='<p style="color:var(--muted);padding:16px;text-align:center">Rest day — no lifting today! Walk, stretch, recover.</p>';return;}
  const plan=WEEK_PLAN[wkIdx];
  const col=phaseCol(WEEK_PHASE[wkIdx]);

  // Phase banner
  const ban=div("phase-banner");ban.style.background=col+"18";ban.style.border=`1px solid ${col}33`;
  const bt=div("phase-title");bt.style.color=col;bt.textContent=`Week ${wkIdx+1} · ${WEEK_PHASE[wkIdx]}`;
  if(plan.m<1){const dt=el("span",{class:"deload-tag"},"⚡ Deload");bt.appendChild(dt);}
  const bn=div("phase-note");bn.textContent=plan.note;ban.append(bt,bn);container.appendChild(ban);

  // Compute volume
  let totalVol=0;
  exList.forEach((ex,ei)=>{const n=Math.max(Math.ceil(setSets(ex.s)*plan.m),1);for(let si=0;si<n;si++){const s=((logs[wkIdx]||{})[dayKey]||{})[ei]||{};totalVol+=(parseFloat((s[si]||{}).kg)||0)*(parseFloat((s[si]||{}).reps)||0);}});

  // Action bar
  const ab=div("log-actions");
  const vs=div("log-vol");vs.textContent=totalVol>0?`📊 ${Math.round(totalVol).toLocaleString()} kg`:"";
  const br=el("div",{style:"display:flex;gap:8px"});
  const cb=el("button",{class:"btn-clear"},"Clear");
  const sb2=el("button",{class:"btn-save"},"Save ✓");
  cb.onclick=()=>{if(!logs[wkIdx])return;delete logs[wkIdx][dayKey];saveLogs();renderLogger(container,wkIdx,dayKey);};
  sb2.onclick=()=>{sb2.classList.add("flashed");sb2.textContent="Saved! ✓";setTimeout(()=>{sb2.classList.remove("flashed");sb2.textContent="Save ✓";},1800);saveLogs();};
  br.append(cb,sb2);ab.append(vs,br);container.appendChild(ab);

  // Exercises
  exList.forEach((ex,ei)=>{
    const numSets=Math.max(Math.ceil(setSets(ex.s)*plan.m),1);
    const exData=(((logs[wkIdx]||{})[dayKey])||{})[ei]||{};
    let exVol=0;for(let si=0;si<numSets;si++){exVol+=(parseFloat((exData[si]||{}).kg)||0)*(parseFloat((exData[si]||{}).reps)||0);}
    const allDone=Array.from({length:numSets}).every((_,si)=>(exData[si]||{}).kg&&(exData[si]||{}).reps);

    const block=div("ex-block"+(allDone?" done":"")+(ex.glute?" glute":""));
    const hdr=el("div",{style:"display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;gap:8px"});
    const hl=div("");
    const nm=div("ex-name");
    nm.textContent=(allDone?"✅ ":"")+ex.e;
    if(ex.glute){const gt=el("span",{class:"glute-tag"},"🍑 Glute focus");nm.appendChild(gt);}
    hl.appendChild(nm);
    const mt=div("ex-meta");mt.innerHTML=`${ex.s} · ${ex.r} reps · ${ex.rest} · <span class="ex-prog">${ex.p}</span>`;hl.appendChild(mt);
    hdr.appendChild(hl);
    const rhsDiv=el("div",{style:"display:flex;gap:6px;align-items:flex-start;flex-shrink:0"});
    if(exVol>0){const vb=div("vol-badge");vb.textContent=Math.round(exVol).toLocaleString()+"kg";rhsDiv.appendChild(vb);}
    if(EX_INFO[ex.e]){const ib=el("button",{class:"info-btn"},"▶ How to");ib.onclick=(e)=>{e.stopPropagation();showDemo(ex.e);};rhsDiv.appendChild(ib);}
    hdr.appendChild(rhsDiv);
    block.appendChild(hdr);
    if(ex.w!=="—"){const wt=div("warmup-tag");wt.textContent="🔥 Warm-up: "+ex.w;block.appendChild(wt);}

    // Set headers
    const ch=div("set-headers");
    ["SET","KG","REPS","✓"].forEach(l=>{const d2=div("set-hdr");d2.textContent=l;ch.appendChild(d2);});
    block.appendChild(ch);

    for(let si=0;si<numSets;si++){
      const setData=exData[si]||{};
      const isDone=!!(setData.kg&&setData.reps);
      const row=div("set-row"+(isDone?" done":""));
      const sn=div("set-num");sn.textContent="S"+(si+1);row.appendChild(sn);

      const kgIn=el("input",{class:"set-input"+(setData.kg?" filled":""),inputmode:"decimal",autocomplete:"off",placeholder:"kg"});
      kgIn.value=setData.kg||"";
      kgIn.addEventListener("input",e=>{
        if(!logs[wkIdx])logs[wkIdx]={};if(!logs[wkIdx][dayKey])logs[wkIdx][dayKey]={};
        if(!logs[wkIdx][dayKey][ei])logs[wkIdx][dayKey][ei]={};if(!logs[wkIdx][dayKey][ei][si])logs[wkIdx][dayKey][ei][si]={};
        logs[wkIdx][dayKey][ei][si].kg=e.target.value;
        const r2=e.target.closest(".set-row");const rep=r2.querySelector("input:last-of-type");
        const done2=!!(e.target.value&&rep&&rep.value);
        r2.className="set-row"+(done2?" done":"");r2.querySelector(".set-status").className="set-status"+(done2?" done":"");r2.querySelector(".set-status").textContent=done2?"✓":"—";
        e.target.className="set-input"+(e.target.value?" filled":"");saveLogs();
      });

      const rpIn=el("input",{class:"set-input"+(setData.reps?" filled":""),inputmode:"numeric",autocomplete:"off",placeholder:ex.r});
      rpIn.value=setData.reps||"";
      rpIn.addEventListener("input",e=>{
        if(!logs[wkIdx])logs[wkIdx]={};if(!logs[wkIdx][dayKey])logs[wkIdx][dayKey]={};
        if(!logs[wkIdx][dayKey][ei])logs[wkIdx][dayKey][ei]={};if(!logs[wkIdx][dayKey][ei][si])logs[wkIdx][dayKey][ei][si]={};
        logs[wkIdx][dayKey][ei][si].reps=e.target.value;
        const r2=e.target.closest(".set-row");const kg2=r2.querySelector("input:first-of-type");
        const done2=!!(e.target.value&&kg2&&kg2.value);
        r2.className="set-row"+(done2?" done":"");r2.querySelector(".set-status").className="set-status"+(done2?" done":"");r2.querySelector(".set-status").textContent=done2?"✓":"—";
        e.target.className="set-input"+(e.target.value?" filled":"");saveLogs();
      });

      const st=div("set-status"+(isDone?" done":""));st.textContent=isDone?"✓":"—";
      row.append(sn,kgIn,rpIn,st);block.appendChild(row);
    }
    const sub=div("sub-tag");sub.textContent="💡 "+ex.sub;block.appendChild(sub);
    container.appendChild(block);
  });

  // Session comments section
  renderCommentSection(container, wkIdx, dayKey);
}

function switchTab(tab){
  currentTab=tab;
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById("page-"+tab).classList.add("active");
  document.querySelectorAll(".tnav-btn").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));
  document.querySelectorAll(".bnav-btn").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));
  window.scrollTo(0,0);
  const renders={overview:renderOverview,workout:renderWorkout,tracker:renderTracker,diet:renderDiet,recipes:renderRecipes,shopping:renderShopping,micros:renderMicros,schedule:renderSchedule,wellness:renderWellness};
  if(renders[tab])renders[tab]();
}

function showDemo(exName){
  const info=EX_INFO[exName];
  if(!info)return;
  const modal=document.getElementById("demo-modal");
  modal.querySelector(".demo-title").textContent=exName;

  // Muscle tags
  const tagsEl=modal.querySelector(".demo-tags");
  tagsEl.innerHTML="";
  info.muscles.forEach(m=>{const s=document.createElement("span");s.className="pill pill-rose";s.style.fontSize="11px";s.textContent=m;tagsEl.appendChild(s);});

  // How-to steps
  const htEl=modal.querySelector(".howto-steps");
  htEl.innerHTML="";
  info.steps.forEach((step,i)=>{
    htEl.innerHTML+=`<div class="howto-step"><div class="howto-num">${i+1}</div><div class="howto-text"><strong>${step.t}:</strong> ${step.d}</div></div>`;
  });

  // Coaching cues
  const cueEl=modal.querySelector(".cues-list");
  cueEl.innerHTML="";
  info.cues.forEach(c=>{cueEl.innerHTML+=`<div class="cue-item"><span class="cue-icon">${c.substring(0,2)}</span><span>${c.substring(2)}</span></div>`;});

  modal.classList.add("open");
  document.body.style.overflow="hidden";
}


function closeDemo(){
  document.getElementById("demo-modal").classList.remove("open");
  document.body.style.overflow="";
}

// Close on backdrop click — called after DOM ready via init()
function initModalListener(){
  const m=document.getElementById("demo-modal");
  if(m){m.addEventListener("click",function(e){
    if(e.target===this||e.target===this.querySelector(".demo-backdrop"))closeDemo();
  });}
}

// SESSION COMMENTS
// ══════════════════════════════════════════════════════════════════════
// comments[weekIdx][dayKey] = [{id, text, date, rating}]
let comments = {};
let pendingRating = 0;

function loadComments(){
  try{ comments = JSON.parse(localStorage.getItem("fph_comments")||"{}"); }catch{}
}
function saveComments(){
  try{ localStorage.setItem("fph_comments", JSON.stringify(comments)); }catch{}
}
function getComments(wk, day){
  return (comments[wk]||{})[day] || [];
}
function addComment(wk, day, text, rating){
  if(!text.trim()) return;
  if(!comments[wk]) comments[wk]={};
  if(!comments[wk][day]) comments[wk][day]=[];
  comments[wk][day].unshift({
    id: Date.now(),
    text: text.trim(),
    date: new Date().toLocaleDateString('en-AU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}),
    rating: rating||0
  });
  saveComments();
}
function deleteComment(wk, day, id){
  if(!(comments[wk]||{})[day]) return;
  comments[wk][day] = comments[wk][day].filter(c=>c.id!==id);
  saveComments();
}

const RATINGS = ["","😫","😔","😐","💪","🔥"];

function renderCommentSection(container, wkIdx, dayKey){
  const existing = container.querySelector(".comment-section");
  if(existing) existing.remove();

  const section = document.createElement("div");
  section.className = "comment-section";

  const cList = getComments(wkIdx, dayKey);
  const labelRow = document.createElement("div");
  labelRow.className = "comment-label";
  labelRow.innerHTML = `<span>📝 SESSION NOTES</span>${cList.length>0?`<span class="comment-count">${cList.length} note${cList.length>1?"s":""}</span>`:""}`;
  section.appendChild(labelRow);

  // Rating picker
  const ratingRow = document.createElement("div");
  ratingRow.className = "rating-row";
  const rLabel = document.createElement("span");
  rLabel.style.cssText="font-size:12px;color:var(--muted);align-self:center;margin-right:4px";
  rLabel.textContent="Session feel:";
  ratingRow.appendChild(rLabel);
  [1,2,3,4,5].forEach(r=>{
    const btn = document.createElement("button");
    btn.className="rating-btn"+(pendingRating===r?" selected":"");
    btn.textContent=RATINGS[r];
    btn.title=["","Hard struggle","Tough","Average","Strong","On fire!"][r];
    btn.onclick=()=>{
      pendingRating = pendingRating===r ? 0 : r;
      renderCommentSection(container, wkIdx, dayKey);
    };
    ratingRow.appendChild(btn);
  });
  section.appendChild(ratingRow);

  // Input row
  const inputRow = document.createElement("div");
  inputRow.className = "comment-input-row";
  const ta = document.createElement("textarea");
  ta.className = "comment-input";
  ta.placeholder = "How did it feel? Any notes, weights to remember, how your body felt...";
  ta.rows = 2;
  const submitBtn = document.createElement("button");
  submitBtn.className = "comment-submit";
  submitBtn.textContent = "Add";
  submitBtn.onclick = ()=>{
    if(!ta.value.trim()) return;
    addComment(wkIdx, dayKey, ta.value, pendingRating);
    pendingRating = 0;
    ta.value = "";
    renderCommentSection(container, wkIdx, dayKey);
  };
  // Allow Enter to submit (Shift+Enter for newline)
  ta.addEventListener("keydown", e=>{
    if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); submitBtn.click(); }
  });
  inputRow.append(ta, submitBtn);
  section.appendChild(inputRow);

  // Comments list
  if(cList.length > 0){
    const list = document.createElement("div");
    list.className = "comment-list";
    cList.forEach(c=>{
      const item = document.createElement("div");
      item.className = "comment-item";
      const meta = document.createElement("div");
      meta.className = "comment-meta";
      const dateSpan = document.createElement("span");
      dateSpan.className = "comment-date";
      dateSpan.textContent = c.date;
      const ratingSpan = document.createElement("span");
      ratingSpan.className = "comment-rating";
      ratingSpan.textContent = c.rating ? RATINGS[c.rating] : "";
      meta.append(dateSpan, ratingSpan);
      const txt = document.createElement("div");
      txt.className = "comment-text";
      txt.textContent = c.text;
      const delBtn = document.createElement("button");
      delBtn.className = "comment-delete";
      delBtn.textContent = "×";
      delBtn.onclick = ()=>{
        if(confirm("Delete this note?")){ deleteComment(wkIdx, dayKey, c.id); renderCommentSection(container, wkIdx, dayKey); }
      };
      item.append(meta, txt, delBtn);
      list.appendChild(item);
    });
    section.appendChild(list);
  } else {
    const empty = document.createElement("div");
    empty.className = "no-comments";
    empty.textContent = "No notes yet — add one after your session!";
    section.appendChild(empty);
  }

  container.appendChild(section);
}

document.querySelectorAll("[data-tab]").forEach(btn=>{btn.addEventListener("click",()=>switchTab(btn.dataset.tab));});

initModalListener();
loadState();
loadComments();
switchTab("overview");
</script>

</body>
</html>
